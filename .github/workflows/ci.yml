# Every push and pull request: lint, types, unit tests, a production build
# with an end-to-end smoke test, the database security tests, a secret scan,
# and a dependency audit. See docs/DEVOPS.md §3.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — lint, types, tests, build, smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders only: the build and the smoke test never reach a real
      # Supabase project or Stripe account.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      STRIPE_SECRET_KEY: ci-placeholder
      STRIPE_PRO_PRICE_ID: ci-placeholder
      STRIPE_WEBHOOK_SECRET: ci-placeholder
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the production build
        run: |
          npm start -- -p 3000 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 1; done
          BASE_URL=http://localhost:3000 npm run test:smoke

  database:
    name: Database — migrations + RLS security tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # The real Supabase Postgres image, with every migration applied.
      - run: supabase db start
      - run: sh scripts/test-db.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
      - run: ./gitleaks git --redact --no-banner .

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Only what ships to production, and only high/critical — a known
      # issue in a build tool shouldn't block every pull request.
      - run: npm audit --omit=dev --audit-level=high
